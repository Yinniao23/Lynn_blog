<section class="guestbook-section mb-12" id="guestbook">
  <h2 class="text-foreground mb-6 flex items-center gap-2 text-2xl font-bold">
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.9 20A9 9 0 104 16.1L2 22z"/>
    </svg>
    <span>Comments</span>
  </h2>

  {{/* Utterances 评论组件 */}}
  <div class="utterances-wrapper rounded-xl border border-border p-4">
    <script src="https://utteranc.es/client.js"
      repo="Yinniao23/Lynn_blog"
      issue-term="pathname"
      label="comment"
      theme="preferred-color-scheme"
      crossorigin="anonymous"
      async>
    </script>
  </div>
</section>

{{/* Sync Utterances theme with site dark/light mode */}}
<script>
(function () {
  function syncUtterancesTheme() {
    var isDark = document.documentElement.classList.contains('dark');
    var theme = isDark ? 'github-dark' : 'github-light';
    var iframe = document.querySelector('.utterances-frame');
    if (iframe) {
      iframe.contentWindow.postMessage(
        { type: 'set-theme', theme: theme },
        'https://utteranc.es'
      );
    }
  }

  // Sync after Utterances loads
  window.addEventListener('message', function (event) {
    if (event.origin === 'https://utteranc.es') syncUtterancesTheme();
  });

  // Sync on theme change
  var observer = new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      if (m.attributeName === 'class') syncUtterancesTheme();
    });
  });
  observer.observe(document.documentElement, { attributes: true });
})();
</script>
