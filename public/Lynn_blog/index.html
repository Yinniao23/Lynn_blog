<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=/" />
    <link rel="canonical" href="https://yinniao23.github.io/" />
    <meta name="robots" content="noindex" />
    <title>Redirecting…</title>
    <script>
      // 旧地址 /Lynn_blog/ 跳转到站点根路径
      var p = window.location.pathname;
      var target = p.replace(/^\/Lynn_blog\/?/, "/");
      window.location.replace(target || "/");
    </script>
  </head>
  <body>
    <p>
      本站已迁移至
      <a href="https://yinniao23.github.io/">https://yinniao23.github.io/</a
      >，正在为你跳转……
    </p>
  </body>
</html>
